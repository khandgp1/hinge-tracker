<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Matches</title>

  <!-- Firebase SDK (compat v9) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <!-- Tesseract.js for OCR name recognition -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow-x: hidden;
      overscroll-behavior: none;
    }

    body.chat-open {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body.chat-open .matches-list,
    body.chat-open .sticky-header-wrapper,
    body.chat-open .tab-view,
    body.chat-open .bottom-nav {
      display: none !important;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      color: #000000;
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 74px;
      position: relative;
    }

    /* Header */
    .sticky-header-wrapper {
      position: sticky;
      top: 0;
      background: #ffffff;
      z-index: 99;
      width: 100%;
    }

    .header {
      position: relative;
      text-align: center;
      padding: 15px 18px 13px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-title {
      font-size: 21.5px;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #000000;
    }

    .header-action-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, transform 0.1s ease;
      color: #000000;
    }

    .header-action-btn:active {
      background: #f0f0f0;
      transform: translateY(-50%) scale(0.92);
    }

    .divider-line {
      height: 1px;
      background-color: #f0f0f0;
      width: 100%;
    }

    /* Matches List */
    .matches-list {
      display: flex;
      flex-direction: column;
    }

    .match-row {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      cursor: pointer;
      background: #ffffff;
      height: 91px;
    }

    .match-row:active {
      background: #fafafa;
    }

    .avatar {
      width: 63px;
      height: 63px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      margin-right: 16px;
      background: #f0f0f0;
    }

    .match-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 3px;
    }

    .name {
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #000000;
      line-height: 1.2;
    }



    .preview-text {
      font-size: 16px;
      color: #8e8e93;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      line-height: 1.25;
      font-weight: 400;
    }

    .preview-text.matched {
      color: #000000;
      font-weight: 600;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 390px;
      background: #111111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 28px 24px;
      z-index: 100;
      height: 74px;
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      cursor: pointer;
    }

    .nav-badge {
      position: absolute;
      top: -4px;
      right: -6px;
      background: #6A1B9A;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #111111;
    }

    .tab-view {
      width: 100%;
    }

    .profile-view {
      display: none;
      width: 100%;
      background: #ffffff;
    }

    .profile-header-wrapper {
      position: static;
      background: #ffffff;
      width: 100%;
    }

    .profile-content {
      width: 100%;
      background: #ffffff;
    }

    .profile-image {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .nav-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid transparent;
      box-sizing: border-box;
      transition: border-color 0.15s ease;
    }

    .nav-avatar.active {
      border: 2px solid #ffffff;
    }

    /* Chat Overlay View */
    .chat-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%) translateZ(0);
      width: 100%;
      max-width: 390px;
      height: 100%;
      height: 100dvh;
      background: #ffffff;
      z-index: 200;
      flex-direction: column;
      box-sizing: border-box;
      overflow: hidden;
      overscroll-behavior: none;
      transition: padding-bottom 0.12s cubic-bezier(0.2, 0, 0, 1);
      will-change: padding-bottom;
    }

    .chat-overlay.active {
      display: flex;
    }

    .chat-header {
      position: sticky;
      top: 0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      z-index: 210;
      height: 54px;
      flex-shrink: 0;
    }

    .chat-back-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #000000;
    }

    .chat-header-spacer {
      width: 32px;
    }

    /* Floating back button & sheet-open space optimizations */
    .chat-floating-back-btn {
      display: none;
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 250;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .chat-floating-back-btn:active {
      transform: scale(0.92);
      background: rgba(240, 240, 240, 0.95);
    }

    .chat-overlay.sheet-open .chat-floating-back-btn {
      display: flex;
    }

    .chat-overlay.sheet-open .chat-header {
      display: none;
    }

    .chat-overlay.sheet-open .chat-body {
      height: 45%;
      flex: 0 0 45%;
      box-sizing: border-box;
      padding-top: 52px;
    }

    .chat-overlay.sheet-open.keyboard-active .chat-body {
      padding-top: 48px;
    }

    .chat-body {
      flex: 50 1 0%;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      overscroll-behavior-y: contain;
    }

    /* Priority Like Banner Card */
    .priority-banner-card {
      position: relative;
      background: #ffffff;
      border: 1.5px solid #ededed;
      border-radius: 16px;
      padding: 34px 20px 22px;
      margin: 18px 4px 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .priority-heart-icon {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 40px;
      background: #111111;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .priority-banner-close {
      position: absolute;
      top: 12px;
      right: 14px;
      background: none;
      border: none;
      font-size: 18px;
      color: #000000;
      cursor: pointer;
      font-weight: 400;
      line-height: 1;
    }

    .priority-banner-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      font-weight: 600;
      color: #111111;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    /* Liked Photo Card */
    .liked-photo-container {
      position: relative;
      max-width: 78%;
      margin: 8px 4px 22px auto;
      border-radius: 16px;
      overflow: visible;
    }

    .liked-photo-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
    }

    .liked-photo-pill {
      position: absolute;
      bottom: 0px;
      right: -6px;
      background: #f7ebe6;
      color: #111111;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 14px;
      padding: 12px 24px;
      min-width: 228px;
      text-align: center;
      border-radius: 22px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
      line-height: 1.2;
      white-space: nowrap;
      z-index: 5;
    }

    /* Feed & Message Items */
    .chat-timestamp {
      font-size: 12.5px;
      color: #8e8e93;
      text-align: center;
      margin: 18px 0 12px;
      font-weight: 500;
    }

    .chat-message-row {
      display: flex;
      align-items: flex-end;
      margin-bottom: 6px;
      width: 100%;
    }

    .chat-message-row.sent {
      justify-content: flex-end;
    }

    .chat-message-row.received {
      justify-content: flex-start;
    }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 8px;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .avatar-placeholder {
      width: 28px;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .bubble {
      padding: 11px 15px;
      font-size: 15px;
      line-height: 1.35;
      max-width: 80%;
      letter-spacing: -0.01em;
      word-break: break-word;
    }

    .bubble.sent-bubble {
      background: #701A51;
      color: #ffffff;
      border-radius: 18px;
      font-weight: 400;
    }

    .bubble.received-bubble {
      background: #EFEFEF;
      color: #000000;
      border-radius: 18px;
      font-weight: 400;
    }

    .read-status {
      font-size: 12px;
      color: #8e8e93;
      text-align: right;
      margin-top: 2px;
      margin-bottom: 8px;
      font-weight: 400;
    }

    /* Fixed Bottom Input Bar */
    .chat-input-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 390px;
      height: 66px;
      background: #ffffff;
      border-top: 1px solid #f0f0f0;
      padding: 10px 16px 14px;
      display: flex;
      align-items: center;
      z-index: 220;
    }

    .chat-input-pill {
      flex: 1;
      height: 42px;
      border: 1.5px solid #e0e0e0;
      border-radius: 21px;
      padding: 0 14px 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
    }

    .chat-input-placeholder {
      color: #8e8e93;
      font-size: 15px;
      font-weight: 400;
    }

    .audio-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Concept A: Docked Bottom Pane Styles */
    .expert-sheet {
      position: relative;
      width: 100%;
      background: rgba(18, 18, 22, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.25);
      z-index: 200;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      overscroll-behavior: contain;
      transition: height 0.3s cubic-bezier(0.16, 1, 0.3, 1), flex-basis 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      color: #ffffff;
      flex-shrink: 0;
    }

    .expert-sheet.collapsed {
      height: 56px;
      flex-basis: 56px;
    }

    .expert-sheet.open,
    .expert-sheet.half {
      height: 55%;
      flex: 0 0 55%;
      box-sizing: border-box;
    }

    .expert-sheet.full {
      height: 75vh;
      flex-basis: 75vh;
    }

    /* Reclaim Space & 40% / 60% Flex Split when Keyboard is Active */
    .chat-overlay.keyboard-active .chat-header {
      height: 42px;
      padding: 6px 14px;
    }

    .chat-overlay.keyboard-active .chat-body,
    .chat-overlay.sheet-open.keyboard-active .chat-body {
      height: auto;
      flex: 40 1 0%;
      min-height: 60px;
      padding: 10px 14px;
      padding-top: 48px;
    }

    .chat-overlay.keyboard-active .expert-sheet.open,
    .chat-overlay.keyboard-active .expert-sheet.half,
    .chat-overlay.keyboard-active .expert-sheet.full {
      height: auto;
      flex: 60 1 0%;
      flex-basis: 0%;
      flex-shrink: 1;
      min-height: 80px;
    }

    .chat-overlay.keyboard-active .expert-sheet {
      transition: none;
    }

    .chat-overlay.keyboard-active .expert-sheet-header {
      display: none;
    }

    .chat-overlay.keyboard-active .expert-input-bar {
      padding: 8px 12px 8px;
    }

    .expert-sheet-header {
      padding: 8px 16px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      user-select: none;
      flex-shrink: 0;
    }

    .expert-drag-handle {
      width: 36px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      margin-bottom: 6px;
    }

    /* Option 3: Slim down the expert sheet header to just the drag handle when open */
    .expert-sheet.open .expert-header-content,
    .expert-sheet.half .expert-header-content,
    .expert-sheet.full .expert-header-content {
      display: none;
    }

    .expert-sheet.open .expert-sheet-header,
    .expert-sheet.half .expert-sheet-header,
    .expert-sheet.full .expert-sheet-header {
      padding: 8px 16px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .expert-sheet.open .expert-drag-handle,
    .expert-sheet.half .expert-drag-handle,
    .expert-sheet.full .expert-drag-handle {
      margin-bottom: 0;
      width: 44px;
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.45);
    }

    .expert-header-content {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .expert-avatar-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8E24AA, #D81B60);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .expert-icon {
      font-size: 15px;
    }

    .expert-title-group {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .expert-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
      line-height: 1.2;
    }

    .expert-subtitle {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 400;
    }

    .expert-unread-badge {
      background: #E53935;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      margin-right: 10px;
    }

    .expert-toggle-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #ffffff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.3s ease, background 0.2s ease;
    }

    .expert-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .chevron-icon {
      transition: transform 0.35s ease;
    }

    .expert-sheet.open .chevron-icon,
    .expert-sheet.half .chevron-icon {
      transform: rotate(180deg);
    }

    .expert-sheet.full .chevron-icon {
      transform: rotate(180deg);
    }

    .expert-sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      overscroll-behavior-y: contain;
    }

    .expert-chat-feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .expert-msg-row {
      display: flex;
      flex-direction: column;
      max-width: 86%;
    }

    .expert-msg-row.expert,
    .expert-msg-row.coach {
      align-self: flex-start;
    }

    .expert-msg-row.client {
      align-self: flex-end;
    }

    .expert-sender-name {
      font-size: 11px;
      font-weight: 600;
      color: #D81B60;
      margin-bottom: 3px;
      margin-left: 2px;
    }

    .expert-msg-row.client .expert-sender-name {
      color: #AB47BC;
      text-align: right;
      margin-right: 2px;
    }

    .expert-bubble {
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.4;
      border-radius: 16px;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .expert-msg-row.expert .expert-bubble,
    .expert-bubble.coach-bubble {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f0f0f5;
      border-top-left-radius: 4px;
    }

    .expert-msg-row.client .expert-bubble,
    .expert-bubble.client-bubble {
      background: linear-gradient(135deg, #7B1FA2, #512DA8);
      color: #ffffff;
      border-top-right-radius: 4px;
    }

    .expert-time {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 3px;
      margin-left: 4px;
    }

    .expert-msg-row.client .expert-time,
    .expert-msg-row.client .expert-sender-name {
      text-align: right;
      margin-right: 4px;
    }



    .expert-input-bar {
      padding: 10px 14px 14px;
      background: rgba(10, 10, 14, 0.6);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .expert-input-field {
      flex: 1;
      min-height: 38px;
      max-height: 100px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 19px;
      padding: 8px 14px;
      color: #ffffff;
      font-size: 16px;
      font-family: inherit;
      line-height: 1.4;
      outline: none;
      box-sizing: border-box;
      overflow-y: auto;
      word-break: break-word;
      white-space: pre-wrap;
      -webkit-user-modify: read-write-plaintext-only;
    }

    .expert-input-field:empty::before {
      content: attr(data-placeholder);
      color: rgba(255, 255, 255, 0.4);
      pointer-events: none;
      display: block;
    }

    .expert-input-field:focus {
      border-color: #AB47BC;
      background: rgba(255, 255, 255, 0.12);
    }

    .expert-send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8E24AA, #D81B60);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .expert-send-btn:active {
      transform: scale(0.95);
    }

    /* ─── Import Review Modal & Sheet ───────────────────────────────── */
    .import-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.48);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .import-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .import-modal-sheet {
      background: #ffffff;
      width: 100%;
      max-width: 390px;
      max-height: 85vh;

    // ─── Deduplication & Avatar Hashing Utilities ────────────────────────
    function getAvatarHash(canvas, x, y, size) {
      const thumb = document.createElement('canvas');
      thumb.width = 8;
      thumb.height = 8;
      const ctx = thumb.getContext('2d');
      ctx.drawImage(canvas, x, y, size, size, 0, 0, 8, 8);
      const imgData = ctx.getImageData(0, 0, 8, 8).data;
      let total = 0;
      const grays = [];
      for (let i = 0; i < imgData.length; i += 4) {
        const gray = 0.299 * imgData[i] + 0.587 * imgData[i + 1] + 0.114 * imgData[i + 2];
        grays.push(gray);
        total += gray;
      }
      const avg = total / 64;
      let hash = '';
      for (let i = 0; i < grays.length; i++) {
        hash += (grays[i] >= avg ? '1' : '0');
      }
      return hash;
    }

    function hammingDistance(h1, h2) {
      if (!h1 || !h2 || h1.length !== h2.length) return 64;
      let dist = 0;
      for (let i = 0; i < h1.length; i++) {
        if (h1[i] !== h2[i]) dist++;
      }
      return dist;
    }

    function getCircularAvatarDataUrl(imgCanvas, x, y, size) {
      const outCanvas = document.createElement('canvas');
      outCanvas.width = 120;
      outCanvas.height = 120;
      const ctx = outCanvas.getContext('2d');
      ctx.beginPath();
      ctx.arc(60, 60, 60, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(imgCanvas, x, y, size, size, 0, 0, 120, 120);
      return outCanvas.toDataURL('image/jpeg', 0.92);
    }

    async function processScreenshotFile(file) {
      openImportModal();

      // ─── 1. Attempt Native Apple Vision & Python Backend ──────────────────
      try {
        if (importLoadingSubtitle) {
          importLoadingSubtitle.textContent = 'Processing with native Apple Vision...';
        }
        const formData = new FormData();
        formData.append('screenshot', file);

        const resp = await fetch('/api/parse-screenshot', {
          method: 'POST',
          body: formData
        });

        if (resp.ok) {
          const data = await resp.json();
          if (data && data.success && Array.isArray(data.matches) && data.matches.length > 0) {
            console.log('[PARSER] Using native Apple Vision response:', data);
            const detected = [];
            let rIdx = 0;
            for (const m of data.matches) {
              rIdx++;
              let detName = m.name;
              const avHash = m.avatarHash;
              let isDuplicate = false;
              for (const existing of matchesData) {
                const nameMatches = existing.name.toLowerCase() === detName.toLowerCase();
                const dist = (existing.hash && avHash) ? hammingDistance(existing.hash, avHash) : 64;
                if (dist <= 10 || (nameMatches && dist <= 16)) {
                  isDuplicate = true;
                  if (dist <= 6) detName = existing.name;
                  break;
                }
              }
              detected.push({
                id: `det_${rIdx}_${Date.now()}`,
                name: detName,
                image: m.avatar,
                hash: avHash,
                isDuplicate: isDuplicate,
                checked: !isDuplicate
              });
            }
            stagedDetectedMatches = detected;
            renderImportReviewSheet();
            return;
          }
        }
      } catch (err) {
        console.warn('[PARSER] Native backend unavailable, falling back to client-side:', err);
      }

      // ─── 2. Fallback: In-browser Canvas & Tesseract.js ────────────────────
      const reader = new FileReader();
      reader.onload = async (event) => {
        const img = new Image();
        img.onload = async () => {
          await analyzeScreenshotImage(img);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function analyzeScreenshotImage(img) {
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      const imgCanvas = document.createElement('canvas');
      imgCanvas.width = w;
      imgCanvas.height = h;
      const ctx = imgCanvas.getContext('2d');
      ctx.drawImage(img, 0, 0);

      const fullImageData = ctx.getImageData(0, 0, w, h);
      const imgBytes = fullImageData.data;

      const grayAt = (px, py) => {
        const idx = (py * w + px) * 4;
        return 0.299 * imgBytes[idx] + 0.587 * imgBytes[idx + 1] + 0.114 * imgBytes[idx + 2];
      };

      const rgbAt = (px, py) => {
        const idx = (py * w + px) * 4;
        return [imgBytes[idx], imgBytes[idx + 1], imgBytes[idx + 2]];
      };

      if (importLoadingSubtitle) {
        importLoadingSubtitle.textContent = 'Detecting match rows & dividers...';
      }

      // ─── 1. Detect Bottom Navigation Bar ────────────────────────────────
      let bottomBoundary = h;
      for (let y = h - 1; y >= Math.round(h * 0.75); y--) {
        let rSum = 0, gSum = 0, bSum = 0, samples = 0;
        for (let x = Math.round(w * 0.1); x < Math.round(w * 0.9); x += 12) {
          const [r, g, b] = rgbAt(x, y);
          rSum += r; gSum += g; bSum += b;
          samples++;
        }
        const avgR = rSum / samples;
        const avgG = gSum / samples;
        const avgB = bSum / samples;

        // Detect purple or dark bottom nav bar
        if ((avgG < 90 && (avgR > 65 || avgB > 65)) || (avgR < 50 && avgG < 50 && avgB < 50)) {
          bottomBoundary = y;
        }
      }

      // ─── 2. Scan for Divider Lines across middle/right column ──────────
      const xStart = Math.round(w * 0.25);
      const xEnd = Math.round(w * 0.95);
      const stepX = 4;
      const numSamples = Math.floor((xEnd - xStart) / stepX);

      const rawCandidates = [];
      const scanStart = Math.round(h * 0.08);
      const scanEnd = bottomBoundary - 15;

      for (let y = scanStart; y < scanEnd; y++) {
        let sum = 0;
        for (let x = xStart; x < xEnd; x += stepX) {
          sum += grayAt(x, y);
        }
        const mean = sum / numSamples;
        let sumSqDiff = 0;
        for (let x = xStart; x < xEnd; x += stepX) {
          const diff = grayAt(x, y) - mean;
          sumSqDiff += diff * diff;
        }
        const std = Math.sqrt(sumSqDiff / numSamples);

        if (std < 5.0 && mean >= 235 && mean <= 252) {
          let aboveSum = 0, belowSum = 0, edgeSamples = 0;
          for (let x = xStart; x < xEnd; x += stepX * 2) {
            aboveSum += grayAt(x, Math.max(0, y - 2));
            belowSum += grayAt(x, Math.min(h - 1, y + 2));
            edgeSamples++;
          }
          const aboveMean = aboveSum / edgeSamples;
          const belowMean = belowSum / edgeSamples;
          const diffAbove = aboveMean - mean;
          const diffBelow = belowMean - mean;

          // A true divider hairline must be bounded by brighter whitespace on BOTH sides
          if (diffAbove >= 1.5 && diffBelow >= 1.5) {
            rawCandidates.push({ y, contrast: diffAbove + diffBelow, std });
          }
        }
      }

      // Group nearby candidates within 20px, keeping highest contrast
      const clustered = [];
      for (const c of rawCandidates) {
        if (clustered.length === 0 || c.y > clustered[clustered.length - 1].y + 20) {
          clustered.push(c);
        } else if (c.contrast > clustered[clustered.length - 1].contrast) {
          clustered[clustered.length - 1] = c;
        }
      }

      // Enforce minimum distance between match rows (>= 18% of width)
      const minRowDist = Math.round(w * 0.18);
      const filteredDividers = [];
      for (const c of clustered) {
        if (filteredDividers.length === 0 || c.y - filteredDividers[filteredDividers.length - 1].y >= minRowDist) {
          filteredDividers.push(c);
        } else if (c.contrast > filteredDividers[filteredDividers.length - 1].contrast) {
          filteredDividers[filteredDividers.length - 1] = c;
        }
      }

      const clusteredDividers = filteredDividers.map(c => c.y);

      // If the space between last divider and bottom boundary is a full row, append boundary
      if (clusteredDividers.length > 0 && (bottomBoundary - clusteredDividers[clusteredDividers.length - 1]) >= Math.round(w * 0.20)) {
        clusteredDividers.push(bottomBoundary);
      }
      console.log('[DEBUG_PARSER] clusteredDividers:', JSON.stringify(clusteredDividers), 'bottomBoundary:', bottomBoundary);

      // ─── 3. Filter Valid Match Rows ─────────────────────────────────────
      const validRows = [];
      for (let i = 0; i < clusteredDividers.length - 1; i++) {
        const top = clusteredDividers[i];
        const bot = clusteredDividers[i + 1];
        const rowH = bot - top;

        // Valid Hinge match row height is between 20% and 40% of image width (excludes partial truncated rows at bottom)
        if (rowH < Math.round(w * 0.20) || rowH > Math.round(w * 0.40)) {
          console.log(`[DEBUG_PARSER] Row ${i} (${top}..${bot}, h=${rowH}) rejected by rowH cutoff [${Math.round(w * 0.20)}, ${Math.round(w * 0.40)}]`);
          continue;
        }

        // Check row background brightness (reject dark/purple warning banners)
        let rowBrightSum = 0, rowSampleCount = 0;
        for (let x = Math.round(w * 0.3); x < Math.round(w * 0.95); x += 10) {
          const [r, g, b] = rgbAt(x, top + Math.round(rowH / 2));
          rowBrightSum += (0.299 * r + 0.587 * g + 0.114 * b);
          rowSampleCount++;
        }
        const rowBrightMean = rowBrightSum / rowSampleCount;
        if (rowBrightMean < 160) {
          console.log(`[DEBUG_PARSER] Row ${i} rejected by rowBrightMean: ${rowBrightMean}`);
          continue; // Non-white / banner card
        }

        // Avatar positioning (centered vertically within row)
        const avatarSize = Math.round(w * 0.175);
        const avatarX = Math.round(w * 0.05);
        let avatarY = top + Math.max(0, Math.round((rowH - avatarSize) / 2));
        if (avatarY + avatarSize > bottomBoundary) {
          avatarY = bottomBoundary - avatarSize;
        }

        // Verify avatar patch has image texture (reject text-only headers like 'Your turn')
        let patchSum = 0, patchSumSq = 0, patchCount = 0;
        for (let py = avatarY; py < avatarY + avatarSize; py += 3) {
          for (let px = avatarX; px < avatarX + avatarSize; px += 3) {
            const g = grayAt(px, py);
            patchSum += g;
            patchSumSq += g * g;
            patchCount++;
          }
        }
        const patchMean = patchSum / patchCount;
        const patchStd = Math.sqrt(Math.max(0, (patchSumSq / patchCount) - (patchMean * patchMean)));

        console.log(`[DEBUG_PARSER] Row ${i} (${top}..${bot}, h=${rowH}): patchMean=${patchMean.toFixed(1)}, patchStd=${patchStd.toFixed(1)}`);
        if (patchStd > 14 && patchMean < 252) {
          validRows.push({
            top,
            bot,
            rowH,
            avatarX,
            avatarY,
            avatarSize
          });
        } else {
          console.log(`[DEBUG_PARSER] Row ${i} rejected by avatar patch (patchStd=${patchStd}, patchMean=${patchMean})`);
        }
      }

      // Fallback: if no divider lines were detected, use geometry fallback
      if (validRows.length === 0) {
        const fallbackAvatarSize = Math.round(w * 0.1731);
        const fallbackStepY = Math.round(h * 0.11875);
        for (let y = Math.round(h * 0.10); y + fallbackAvatarSize <= bottomBoundary - 10; y += fallbackStepY) {
          validRows.push({
            top: y - 10,
            bot: y + fallbackAvatarSize + 10,
            rowH: fallbackStepY,
            avatarX: Math.round(w * 0.05),
            avatarY: y,
            avatarSize: fallbackAvatarSize
          });
        }
      }

      // ─── 4. OCR Worker & Text Extraction ────────────────────────────────
      if (importLoadingSubtitle) {
        importLoadingSubtitle.textContent = 'Initializing text recognition...';
      }

      let worker = null;
      try {
        if (window.Tesseract && typeof Tesseract.createWorker === 'function') {
          const workerPromise = Tesseract.createWorker('eng');
          const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('OCR init timeout')), 4500));
          worker = await Promise.race([workerPromise, timeoutPromise]);
          if (worker && typeof worker.setParameters === 'function') {
            await worker.setParameters({
              tessedit_pageseg_mode: '7' // Single text line mode: stops hallucinations
            });
          }
        }
      } catch (err) {
        console.warn('Tesseract worker initialization skipped/timed out:', err);
        worker = null;
      }

      const detected = [];
      let rowIndex = 0;

      for (const row of validRows) {
        rowIndex++;
        if (importLoadingSubtitle) {
          importLoadingSubtitle.textContent = `Analyzing match ${rowIndex} of ${validRows.length}...`;
        }

        // A. Circular Avatar Crop & Visual Hash
        const avatarUrl = getCircularAvatarDataUrl(imgCanvas, row.avatarX, row.avatarY, row.avatarSize);
        const avatarHash = getAvatarHash(imgCanvas, row.avatarX, row.avatarY, row.avatarSize);

        // B. Dynamic Name Line Isolation (strictly cut off before purple hearts/icons)
        const nameX = row.avatarX + row.avatarSize + Math.round(w * 0.015);
        const searchW = Math.round(w * 0.38);
        const searchH = Math.round(row.rowH * 0.75);

        // Scan row for bold black text (brightness < 130, neutral saturation to avoid purple heart/badge)
        let startTextX = -1;
        let endTextX = searchW;
        let whiteGap = 0;

        for (let dx = 0; dx < searchW; dx++) {
          let hasDarkPixel = false;
          for (let dy = 0; dy < searchH; dy++) {
            const [r, g, b] = rgbAt(nameX + dx, row.top + dy);
            const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
            const isPurple = Math.abs(r - b) > 25 && b > r * 0.8;
            if (brightness < 130 && !isPurple) {
              hasDarkPixel = true;
              break;
            }
          }

          if (hasDarkPixel) {
            if (startTextX === -1) {
              startTextX = Math.max(0, dx - 2);
            }
            whiteGap = 0;
          } else if (startTextX !== -1) {
            whiteGap++;
            // Gap of >= 7px marks end of name before badge/heart icons
            if (whiteGap >= 7) {
              endTextX = dx - whiteGap + 2;
              break;
            }
          }
        }

        if (startTextX === -1) {
          startTextX = 0;
          endTextX = Math.round(w * 0.25);
        }

        // Find vertical bounds of text within [startTextX, endTextX]
        let minTextY = searchH;
        let maxTextY = 0;
        for (let dy = 0; dy < searchH; dy++) {
          for (let dx = startTextX; dx < endTextX; dx++) {
            const [r, g, b] = rgbAt(nameX + dx, row.top + dy);
            const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
            const isPurple = Math.abs(r - b) > 25 && b > r * 0.8;
            if (brightness < 130 && !isPurple) {
              if (dy < minTextY) minTextY = dy;
              if (dy > maxTextY) maxTextY = dy;
            }
          }
        }

        if (maxTextY <= minTextY) {
          minTextY = Math.round(row.rowH * 0.15);
          maxTextY = Math.round(row.rowH * 0.50);
        }

        const actualMinY = Math.max(0, minTextY - 4);
        const actualMaxY = Math.min(row.rowH, maxTextY + 5);
        const textH = actualMaxY - actualMinY;
        const textW = Math.max(20, endTextX - startTextX);

        const cropX = nameX + startTextX;
        const cropY = row.top + actualMinY;

        const scale = 3;
        const pad = 24;
        const nameCanvas = document.createElement('canvas');
        nameCanvas.width = textW * scale + pad * 2;
        nameCanvas.height = textH * scale + pad * 2;
        const nameCtx = nameCanvas.getContext('2d');
        nameCtx.fillStyle = '#ffffff';
        nameCtx.fillRect(0, 0, nameCanvas.width, nameCanvas.height);
        nameCtx.imageSmoothingEnabled = true;
        nameCtx.imageSmoothingQuality = 'high';
        nameCtx.drawImage(imgCanvas, cropX, cropY, textW, textH, pad, pad, textW * scale, textH * scale);

        let detectedName = '';
        if (worker) {
          try {
            const recognizePromise = worker.recognize(nameCanvas);
            const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('Row OCR timeout')), 2200));
            const res = await Promise.race([recognizePromise, timeoutPromise]);
            const lines = (res.data.text || '').split('\n');
            for (const line of lines) {
              const words = line.split(/\s+/);
              for (const wd of words) {
                const clean = wd.replace(/[^a-zA-Z]/g, '');
                if (clean.length >= 2) {
                  detectedName = clean.charAt(0).toUpperCase() + clean.slice(1).toLowerCase();
                  break;
                }
              }
              if (detectedName) break;
            }
          } catch (e) {
            console.warn('OCR error on row', rowIndex, e);
          }
        }

        if (!detectedName) {
          detectedName = `Match ${rowIndex}`;
        }

        // C. Dual-key Deduplication: Check Name & Avatar Hash
        let isDuplicate = false;
        for (const existing of matchesData) {
          const nameMatches = existing.name.toLowerCase() === detectedName.toLowerCase();
          const dist = (existing.hash && avatarHash) ? hammingDistance(existing.hash, avatarHash) : 64;

          if (dist <= 10 || (nameMatches && dist <= 16)) {
            isDuplicate = true;
            if (dist <= 6) detectedName = existing.name;
            break;
          }
        }

        detected.push({
          id: `det_${rowIndex}_${Date.now()}`,
          name: detectedName,
          image: avatarUrl,
          hash: avatarHash,
          isDuplicate: isDuplicate,
          checked: !isDuplicate
        });
      }

      if (worker) {
        try {
          await worker.terminate();
        } catch (e) {}
      }

      stagedDetectedMatches = detected;
      renderImportReviewSheet();
    }

    function renderImportReviewSheet() {
      importLoadingState.style.display = 'none';
      importContentState.style.display = 'flex';

      const newMatches = stagedDetectedMatches.filter(m => !m.isDuplicate);
      const duplicateMatches = stagedDetectedMatches.filter(m => m.isDuplicate);

      let html = '';

      if (newMatches.length > 0) {
        html += `<div class="import-section-title">New Matches Found (${newMatches.length})</div>`;
        html += newMatches.map(m => `
          <div class="import-match-card ${m.checked ? 'checked' : ''}" data-id="${m.id}">
            <img class="import-card-avatar" src="${m.image}" alt="${m.name}">
            <div class="import-card-info">
              <input type="text" class="import-card-name-input" value="${m.name}" data-id="${m.id}" aria-label="Match name">
              <span class="preview-text matched" style="font-size: 13px; color: #8e8e93; margin-top: 2px;">You matched</span>
            </div>
            <div class="import-checkbox-custom">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
          </div>
        `).join('');
      } else {
        html += `
          <div style="padding: 24px 8px; text-align: center; color: #8e8e93; font-size: 15px;">
            No new matches detected in this screenshot.
          </div>
        `;
      }

      if (duplicateMatches.length > 0) {
        html += `<div class="import-section-title" style="margin-top: 20px;">Already in Matches (${duplicateMatches.length})</div>`;
        html += duplicateMatches.map(m => `
          <div class="import-match-card disabled">
            <img class="import-card-avatar" src="${m.image}" alt="${m.name}">
            <div class="import-card-info">
              <span style="font-size: 16px; font-weight: 600; color: #555555;">${m.name}</span>
              <span class="import-card-badge">Already Added</span>
            </div>
          </div>
        `).join('');
      }

      importReviewList.innerHTML = html;

      // Attach card toggle listeners
      importReviewList.querySelectorAll('.import-match-card:not(.disabled)').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.import-card-name-input')) return;
          const id = card.getAttribute('data-id');
          const item = stagedDetectedMatches.find(m => m.id === id);
          if (item) {
            item.checked = !item.checked;
            card.classList.toggle('checked', item.checked);
            updateConfirmButton();
          }
        });
      });

      // Attach name input change listeners
      importReviewList.querySelectorAll('.import-card-name-input').forEach(input => {
        input.addEventListener('input', (e) => {
          const id = input.getAttribute('data-id');
          const item = stagedDetectedMatches.find(m => m.id === id);
          if (item) {
            item.name = e.target.value.trim() || item.name;
          }
        });
      });

      updateConfirmButton();
    }

    function updateConfirmButton() {
      const checkedItems = stagedDetectedMatches.filter(m => !m.isDuplicate && m.checked);
      if (checkedItems.length > 0) {
        importConfirmBtn.disabled = false;
        importConfirmBtn.textContent = `Import ${checkedItems.length} New Match${checkedItems.length > 1 ? 'es' : ''}`;
      } else {
        importConfirmBtn.disabled = true;
        importConfirmBtn.textContent = 'Import Matches';
      }
    }

    if (importConfirmBtn) {
      importConfirmBtn.addEventListener('click', () => {
        const toAdd = stagedDetectedMatches.filter(m => !m.isDuplicate && m.checked);
        if (toAdd.length === 0) return;

        const newFormattedMatches = toAdd.map(m => ({
          name: m.name,
          preview: `You matched with ${m.name}`,
          isMatchedNotice: true,
          image: m.image,
          hash: m.hash
        }));

        customMatches = [...newFormattedMatches, ...customMatches];
        try {
          localStorage.setItem('hinge_custom_matches', JSON.stringify(customMatches));
        } catch (e) {
          console.warn('Could not save to localStorage:', e);
        }

        matchesData = [...customMatches, ...defaultMatchesData];
        renderMatchesList();
        closeImportModal();
      });
    }

    // Expose for testing & manual trigger
    window.processScreenshotFile = processScreenshotFile;
    window.analyzeScreenshotImage = analyzeScreenshotImage;
    window.runTestParser = async function() {
      try {
        console.log('[TEST_PARSER] Starting test parse...');
        const res = await fetch('/media_1789926022466.jpg');
        const blob = await res.blob();
        const file = new File([blob], 'media_1789926022466.jpg', { type: 'image/jpeg' });
        await processScreenshotFile(file);
        console.log('[TEST_PARSER] processScreenshotFile triggered successfully');
      } catch (err) {
        console.error('[TEST_PARSER] Error:', err);
      }
    };

    // Touch boundary overscroll guards to prevent white screen and viewport rubber-banding
    if (chatOverlay) {
      chatOverlay.addEventListener('touchmove', (e) => {
        // Prevent drags on overlay chrome outside the scrollable chat bodies
        if (!e.target.closest('#chatBody, #expertSheetBody, #expertInput')) {
          e.preventDefault();
        }
      }, { passive: false });
    }

    const expertSheetBody = document.getElementById('expertSheetBody');
    if (expertSheetBody) {
      let expertTouchStartY = 0;
      expertSheetBody.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length > 0) {
          expertTouchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      expertSheetBody.addEventListener('touchmove', (e) => {
        if (!e.touches || e.touches.length === 0) return;
        const currentY = e.touches[0].clientY;
        const deltaY = currentY - expertTouchStartY;
        const isAtTop = expertSheetBody.scrollTop <= 0;
        const isAtBottom = expertSheetBody.scrollTop + expertSheetBody.clientHeight >= expertSheetBody.scrollHeight - 1;

        // Swiping down when at top boundary
        if (deltaY > 0 && isAtTop) {
          e.preventDefault();
        }
        // Swiping up when at bottom boundary
        if (deltaY < 0 && isAtBottom) {
          e.preventDefault();
        }
      }, { passive: false });
    }

    if (chatBody) {
      let chatTouchStartY = 0;
      chatBody.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length > 0) {
          chatTouchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      chatBody.addEventListener('touchmove', (e) => {
        if (!e.touches || e.touches.length === 0) return;
        const currentY = e.touches[0].clientY;
        const deltaY = currentY - chatTouchStartY;
        const isAtTop = chatBody.scrollTop <= 0;
        const isAtBottom = chatBody.scrollTop + chatBody.clientHeight >= chatBody.scrollHeight - 1;

        if (deltaY > 0 && isAtTop) {
          e.preventDefault();
        }
        if (deltaY < 0 && isAtBottom) {
          e.preventDefault();
        }
      }, { passive: false });
    }

    if (chatBackBtn) {
      chatBackBtn.addEventListener('click', closeChat);
    }
    if (chatFloatingBackBtn) {
      chatFloatingBackBtn.addEventListener('click', closeChat);
    }

    if (expertHeader) {
      expertHeader.addEventListener('click', toggleExpertSheet);
    }

    if (expertSendBtn) {
      expertSendBtn.addEventListener('click', sendExpertMessage);
    }

    // ─── Tab Navigation (Matches & Profile) ─────────────────────────────────
    let currentTab = 'matches';
    const tabScrollPositions = {
      matches: 0,
      profile: 0
    };

    function switchTab(tab) {
      if (currentTab === tab) return;

      // Save scroll position of outgoing tab
      tabScrollPositions[currentTab] = window.scrollY || document.documentElement.scrollTop || 0;

      const matchesView = document.getElementById('matchesView');
      const profileView = document.getElementById('profileView');
      const navChatIcon = document.getElementById('navChatIcon');
      const navAvatar = document.getElementById('navAvatar');

      if (tab === 'profile') {
        currentTab = 'profile';
        if (matchesView) matchesView.style.display = 'none';
        if (profileView) profileView.style.display = 'block';

        if (navChatIcon) navChatIcon.setAttribute('fill', '#888888');
        if (navAvatar) navAvatar.classList.add('active');

        window.scrollTo(0, tabScrollPositions.profile || 0);
      } else if (tab === 'matches') {
        currentTab = 'matches';
        if (profileView) profileView.style.display = 'none';
        if (matchesView) matchesView.style.display = 'block';

        if (navChatIcon) navChatIcon.setAttribute('fill', '#FFFFFF');
        if (navAvatar) navAvatar.classList.remove('active');

        window.scrollTo(0, tabScrollPositions.matches || 0);
      }
    }

    const navChatBtn = document.getElementById('navChatBtn');
    const navProfileBtn = document.getElementById('navProfileBtn');

    if (navChatBtn) {
      navChatBtn.addEventListener('click', () => switchTab('matches'));
    }
    if (navProfileBtn) {
      navProfileBtn.addEventListener('click', () => switchTab('profile'));
    }

    // Mobile 60fps Synchronous Visual Viewport API Input Accessory Transformer
    let vpScheduled = false;

    function syncVisualViewport() {
      vpScheduled = false;
      if (!window.visualViewport) return;
      const chatOverlay = document.getElementById('chatOverlay');
      if (!chatOverlay || !chatOverlay.classList.contains('active')) return;

      const vpHeight = window.visualViewport.height;
      const vpOffsetTop = window.visualViewport.offsetTop || 0;
      const winHeight = window.innerHeight;
      const keyboardHeight = Math.max(0, winHeight - vpHeight - vpOffsetTop);

      if (keyboardHeight > 100 || document.activeElement === expertInput) {
        chatOverlay.classList.add('keyboard-active');
        chatOverlay.style.top = `${vpOffsetTop}px`;
        chatOverlay.style.height = `${vpHeight}px`;
        chatOverlay.style.paddingBottom = '0px';
      } else {
        chatOverlay.classList.remove('keyboard-active');
        chatOverlay.style.top = '0px';
        chatOverlay.style.height = '';
        chatOverlay.style.paddingBottom = '0px';
      }

      window.scrollTo(0, 0);
      chatOverlay.scrollTop = 0;

      const chatBody = document.getElementById('chatBody');
      const expertSheetBody = document.getElementById('expertSheetBody');
      if (chatBody) chatBody.scrollTop = chatBody.scrollHeight;
      if (expertSheetBody) expertSheetBody.scrollTop = expertSheetBody.scrollHeight;
    }

    function updateVisualViewport() {
      if (!vpScheduled) {
        vpScheduled = true;
        requestAnimationFrame(syncVisualViewport);
      }
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateVisualViewport, { passive: true });
      window.visualViewport.addEventListener('scroll', updateVisualViewport, { passive: true });
    }

    if (expertInput) {
      const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

      expertInput.addEventListener('focus', () => {
        document.body.style.position = 'fixed';
        document.body.style.width = '100%';
        window.scrollTo(0, 0);
        updateVisualViewport();
        setTimeout(updateVisualViewport, 50);
        setTimeout(updateVisualViewport, 150);
        setTimeout(updateVisualViewport, 300);
      });

      expertInput.addEventListener('blur', () => {
        document.body.style.position = '';
        document.body.style.width = '';
        setTimeout(() => {
          const chatOverlay = document.getElementById('chatOverlay');
          if (chatOverlay && document.activeElement !== expertInput) {
            chatOverlay.classList.remove('keyboard-active');
            chatOverlay.style.top = '0px';
            chatOverlay.style.height = '';
            chatOverlay.style.paddingBottom = '0px';
          }
        }, 150);
      });

      const autoResize = () => {
        expertInput.style.height = 'auto';
        const newHeight = Math.min(expertInput.scrollHeight, 100);
        expertInput.style.height = Math.max(newHeight, 38) + 'px';
      };

      expertInput.addEventListener('input', autoResize);

      expertInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          if (isTouchDevice) {
            // Mobile: Enter key on virtual keyboard inserts a newline naturally
          } else if (e.shiftKey) {
            // Desktop: Shift+Enter inserts a newline naturally
          } else {
            // Desktop: Enter sends the message
            e.preventDefault();
            sendExpertMessage();
          }
        }
      });
    }
  </script>

  <button id="debugTestBtn" style="display:none;" onclick="window.runTestParser()">⚡ Test Parser</button>
</body>
