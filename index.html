<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Matches</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      color: #000000;
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 74px;
      position: relative;
    }

    /* Header */
    .sticky-header-wrapper {
      position: sticky;
      top: 0;
      background: #ffffff;
      z-index: 99;
      width: 100%;
    }

    .header {
      text-align: center;
      padding: 15px 0 13px;
      background: #ffffff;
    }

    .header-title {
      font-size: 21.5px;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #000000;
    }

    .divider-line {
      height: 1px;
      background-color: #f0f0f0;
      width: 100%;
    }

    /* Matches List */
    .matches-list {
      display: flex;
      flex-direction: column;
    }

    .match-row {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      cursor: pointer;
      background: #ffffff;
      height: 91px;
    }

    .match-row:active {
      background: #fafafa;
    }

    .avatar {
      width: 63px;
      height: 63px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      margin-right: 16px;
      background: #f0f0f0;
    }

    .match-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 3px;
    }

    .name {
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #000000;
      line-height: 1.2;
    }



    .preview-text {
      font-size: 16px;
      color: #8e8e93;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      line-height: 1.25;
      font-weight: 400;
    }

    .preview-text.matched {
      color: #000000;
      font-weight: 600;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 390px;
      background: #111111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 28px 24px;
      z-index: 100;
      height: 74px;
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      cursor: pointer;
    }

    .nav-badge {
      position: absolute;
      top: -4px;
      right: -6px;
      background: #6A1B9A;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #111111;
    }

    .nav-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Chat Overlay View */
    .chat-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%) translateZ(0);
      width: 100%;
      max-width: 390px;
      height: 100vh;
      background: #ffffff;
      z-index: 200;
      flex-direction: column;
      box-sizing: border-box;
      transition: padding-bottom 0.12s cubic-bezier(0.2, 0, 0, 1);
      will-change: padding-bottom;
    }

    .chat-overlay.active {
      display: flex;
    }

    .chat-header {
      position: sticky;
      top: 0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      z-index: 210;
      height: 54px;
      flex-shrink: 0;
    }

    .chat-back-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #000000;
    }

    .chat-header-spacer {
      width: 32px;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      -webkit-overflow-scrolling: touch;
      transition: flex 0.3s ease;
    }

    /* Priority Like Banner Card */
    .priority-banner-card {
      position: relative;
      background: #ffffff;
      border: 1.5px solid #ededed;
      border-radius: 16px;
      padding: 34px 20px 22px;
      margin: 18px 4px 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .priority-heart-icon {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 40px;
      background: #111111;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .priority-banner-close {
      position: absolute;
      top: 12px;
      right: 14px;
      background: none;
      border: none;
      font-size: 18px;
      color: #000000;
      cursor: pointer;
      font-weight: 400;
      line-height: 1;
    }

    .priority-banner-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      font-weight: 600;
      color: #111111;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    /* Liked Photo Card */
    .liked-photo-container {
      position: relative;
      max-width: 78%;
      margin: 8px 4px 22px auto;
      border-radius: 16px;
      overflow: visible;
    }

    .liked-photo-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
    }

    .liked-photo-pill {
      position: absolute;
      bottom: 0px;
      right: -6px;
      background: #f7ebe6;
      color: #111111;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 14px;
      padding: 12px 24px;
      min-width: 228px;
      text-align: center;
      border-radius: 22px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
      line-height: 1.2;
      white-space: nowrap;
      z-index: 5;
    }

    /* Feed & Message Items */
    .chat-timestamp {
      font-size: 12.5px;
      color: #8e8e93;
      text-align: center;
      margin: 18px 0 12px;
      font-weight: 500;
    }

    .chat-message-row {
      display: flex;
      align-items: flex-end;
      margin-bottom: 6px;
      width: 100%;
    }

    .chat-message-row.sent {
      justify-content: flex-end;
    }

    .chat-message-row.received {
      justify-content: flex-start;
    }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 8px;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .avatar-placeholder {
      width: 28px;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .bubble {
      padding: 11px 15px;
      font-size: 15px;
      line-height: 1.35;
      max-width: 80%;
      letter-spacing: -0.01em;
      word-break: break-word;
    }

    .bubble.sent-bubble {
      background: #701A51;
      color: #ffffff;
      border-radius: 18px;
      font-weight: 400;
    }

    .bubble.received-bubble {
      background: #EFEFEF;
      color: #000000;
      border-radius: 18px;
      font-weight: 400;
    }

    .read-status {
      font-size: 12px;
      color: #8e8e93;
      text-align: right;
      margin-top: 2px;
      margin-bottom: 8px;
      font-weight: 400;
    }

    /* Fixed Bottom Input Bar */
    .chat-input-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 390px;
      height: 66px;
      background: #ffffff;
      border-top: 1px solid #f0f0f0;
      padding: 10px 16px 14px;
      display: flex;
      align-items: center;
      z-index: 220;
    }

    .chat-input-pill {
      flex: 1;
      height: 42px;
      border: 1.5px solid #e0e0e0;
      border-radius: 21px;
      padding: 0 14px 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
    }

    .chat-input-placeholder {
      color: #8e8e93;
      font-size: 15px;
      font-weight: 400;
    }

    .audio-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Concept A: Docked Bottom Pane Styles */
    .expert-sheet {
      position: relative;
      width: 100%;
      background: rgba(18, 18, 22, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.25);
      z-index: 200;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: height 0.3s cubic-bezier(0.16, 1, 0.3, 1), flex-basis 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      color: #ffffff;
      flex-shrink: 0;
    }

    .expert-sheet.collapsed {
      height: 56px;
      flex-basis: 56px;
    }

    .expert-sheet.open,
    .expert-sheet.half {
      height: 40vh;
      flex-basis: 40vh;
    }

    .expert-sheet.full {
      height: 75vh;
      flex-basis: 75vh;
    }

    /* Reclaim Space & 35% / 65% Flex Split when Keyboard is Active */
    .chat-overlay.keyboard-active .chat-header {
      height: 42px;
      padding: 6px 14px;
    }

    .chat-overlay.keyboard-active .chat-body {
      flex: 35 1 0%;
      min-height: 70px;
      padding: 10px 14px;
    }

    .chat-overlay.keyboard-active .expert-sheet.open,
    .chat-overlay.keyboard-active .expert-sheet.half,
    .chat-overlay.keyboard-active .expert-sheet.full {
      height: auto;
      flex: 65 1 0%;
      flex-basis: 0%;
      flex-shrink: 1;
      min-height: 110px;
    }

    .chat-overlay.keyboard-active .expert-sheet-header {
      display: none;
    }

    .chat-overlay.keyboard-active .expert-input-bar {
      padding: 8px 12px 8px;
    }

    .expert-sheet-header {
      padding: 8px 16px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      user-select: none;
      flex-shrink: 0;
    }

    .expert-drag-handle {
      width: 36px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      margin-bottom: 6px;
    }

    .expert-header-content {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .expert-avatar-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8E24AA, #D81B60);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .expert-icon {
      font-size: 15px;
    }

    .expert-title-group {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .expert-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
      line-height: 1.2;
    }

    .expert-subtitle {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 400;
    }

    .expert-unread-badge {
      background: #E53935;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      margin-right: 10px;
    }

    .expert-toggle-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #ffffff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.3s ease, background 0.2s ease;
    }

    .expert-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .chevron-icon {
      transition: transform 0.35s ease;
    }

    .expert-sheet.open .chevron-icon,
    .expert-sheet.half .chevron-icon {
      transform: rotate(180deg);
    }

    .expert-sheet.full .chevron-icon {
      transform: rotate(180deg);
    }

    .expert-sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      -webkit-overflow-scrolling: touch;
    }

    .expert-chat-feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .expert-msg-row {
      display: flex;
      flex-direction: column;
      max-width: 86%;
    }

    .expert-msg-row.expert {
      align-self: flex-start;
    }

    .expert-msg-row.client {
      align-self: flex-end;
    }

    .expert-sender-name {
      font-size: 11px;
      font-weight: 600;
      color: #D81B60;
      margin-bottom: 3px;
      margin-left: 2px;
    }

    .expert-msg-row.client .expert-sender-name {
      color: #AB47BC;
      text-align: right;
      margin-right: 2px;
    }

    .expert-bubble {
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.4;
      border-radius: 16px;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .expert-msg-row.expert .expert-bubble {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f0f0f5;
      border-top-left-radius: 4px;
    }

    .expert-msg-row.client .expert-bubble {
      background: linear-gradient(135deg, #7B1FA2, #512DA8);
      color: #ffffff;
      border-top-right-radius: 4px;
    }

    .expert-time {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 3px;
      margin-left: 4px;
    }

    .expert-msg-row.client .expert-time {
      text-align: right;
      margin-right: 4px;
    }

    .expert-input-bar {
      padding: 10px 14px 14px;
      background: rgba(10, 10, 14, 0.6);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .expert-input-field {
      flex: 1;
      min-height: 38px;
      max-height: 100px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 19px;
      padding: 8px 14px;
      color: #ffffff;
      font-size: 13.5px;
      font-family: inherit;
      line-height: 1.4;
      outline: none;
      box-sizing: border-box;
      overflow-y: auto;
      word-break: break-word;
      white-space: pre-wrap;
      -webkit-user-modify: read-write-plaintext-only;
    }

    .expert-input-field:empty::before {
      content: attr(data-placeholder);
      color: rgba(255, 255, 255, 0.4);
      pointer-events: none;
      display: block;
    }

    .expert-input-field:focus {
      border-color: #AB47BC;
      background: rgba(255, 255, 255, 0.12);
    }

    .expert-send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8E24AA, #D81B60);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .expert-send-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <div class="sticky-header-wrapper">
    <header class="header">
      <h1 class="header-title">Matches</h1>
    </header>
    <div class="divider-line"></div>
  </div>

  <main class="matches-list" id="matchesList"></main>

  <!-- Fullscreen Chat Overlay -->
  <div id="chatOverlay" class="chat-overlay">
    <div class="chat-header">
      <button id="chatBackBtn" class="chat-back-btn" aria-label="Back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <span class="chat-title">Aubrey</span>
      <div class="chat-header-spacer"></div>
    </div>

    <div id="chatBody" class="chat-body">
      <!-- Dynamic Message Feed -->
      <div id="chatFeed"></div>
    </div>

    <!-- Concept A: Floating Bottom Sheet Overlay -->
    <div id="expertBottomSheet" class="expert-sheet collapsed">
      <div id="expertSheetHeader" class="expert-sheet-header">
        <div class="expert-drag-handle"></div>
        <div class="expert-header-content">
          <div class="expert-avatar-badge">
            <span class="expert-icon">🎓</span>
          </div>
          <div class="expert-title-group">
            <span class="expert-title">Coach & Client Dialogue</span>
            <span class="expert-subtitle">Real-time Advice Stream</span>
          </div>
          <span id="expertBadge" class="expert-unread-badge">2</span>
          <button id="expertExpandBtn" class="expert-toggle-btn" aria-label="Toggle drawer">
            <svg id="expertChevron" class="chevron-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
          </button>
        </div>
      </div>

      <div id="expertSheetBody" class="expert-sheet-body">
        <div id="expertChatFeed" class="expert-chat-feed"></div>
      </div>

      <div class="expert-input-bar">
        <div id="expertInput" class="expert-input-field" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Ask coach for advice..."></div>
        <button id="expertSendBtn" class="expert-send-btn" aria-label="Send message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <nav class="bottom-nav">
    <!-- Hinge 'H' Icon -->
    <div class="nav-item">
      <svg width="100" height="100" viewBox="0 0 100 100" fill="#888888">
        <!-- Left Pillar -->
        <rect x="22" y="20" width="13" height="60" />

        <!-- Right Pillar -->
        <rect x="56" y="20" width="13" height="60" />

        <!-- Taller horizontal crossbar + matching curved flick -->
        <path d="
          M 35, 48.5
          C 38, 44  40.5, 44  43.5, 44
          L 69, 44
          C 74, 44  78.5, 40  83.5, 34
          L 91, 39.5
          C 84.5, 48.5  77.5, 57  69, 57
          L 43.5, 57
          C 38, 57  35, 63  35, 71
          Z
        " />
      </svg>
    </div>

    <!-- Star Icon -->
    <div class="nav-item">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <polygon
          points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
        </polygon>
      </svg>
    </div>

    <!-- Heart Icon with Badge -->
    <div class="nav-item">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <path
          d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
        </path>
      </svg>
      <span class="nav-badge">9</span>
    </div>

    <!-- Active Chat Speech Bubble Icon -->
    <div class="nav-item">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="#FFFFFF">
        <path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8l-4 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" />
      </svg>
    </div>

    <!-- Profile Icon -->
    <div class="nav-item">
      <img src="assets/nav_profile.png" alt="Profile" class="nav-avatar">
    </div>
  </nav>

  <script>
    const matchesData = [
      {
        name: "Divya",
        preview: "You matched with Divya",
        isMatchedNotice: true,
        image: "assets/divya.jpg"
      },
      {
        name: "Aubrey",
        preview: "ummmmmmm how's those eyes are gor",
        isMatchedNotice: false,
        image: "assets/aubrey.jpg"
      },
      {
        name: "Sydney",
        preview: "someone seems chill af",
        isMatchedNotice: false,

    const expertDialogueData = [

    let sheetState = 'collapsed'; // 'collapsed', 'half', 'full'

    function renderExpertChat() {
      const feed = document.getElementById('expertChatFeed');
      if (!feed) return;

      feed.innerHTML = expertDialogueData.map(item => `
        <div class="expert-msg-row ${item.sender}">
          <span class="expert-sender-name">${item.sender === 'expert' ? item.name : 'You (Client)'}</span>
          <div class="expert-bubble">${item.text}</div>
          <span class="expert-time">${item.time}</span>
        </div>
      `).join('');

      const body = document.getElementById('expertSheetBody');
      if (body) body.scrollTop = body.scrollHeight;
    }

    function toggleExpertSheet() {
      const sheet = document.getElementById('expertBottomSheet');
      const badge = document.getElementById('expertBadge');
      const chatBody = document.getElementById('chatBody');
      if (!sheet) return;

      if (sheetState === 'collapsed') {
        sheetState = 'open';
        sheet.className = 'expert-sheet open';
        if (badge) badge.style.display = 'none';
      } else {
        sheetState = 'collapsed';
        sheet.className = 'expert-sheet collapsed';
      }

      // Keep recent messages visible in main chat pane during and after height transition
      if (chatBody) {
        chatBody.scrollTop = chatBody.scrollHeight;
        setTimeout(() => {
          chatBody.scrollTop = chatBody.scrollHeight;
        }, 300);
      }
    }

    function sendExpertMessage() {
      const input = document.getElementById('expertInput');
      if (!input) return;
      const text = (input.innerText || input.textContent || '').trim();
      if (!text) return;

      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      expertDialogueData.push({
        sender: 'client',
        name: 'You (Client)',
        text: text,
        time: timeStr
      });

      input.innerText = '';
      input.style.height = '';
      renderExpertChat();

      // Simulated Coach reply after 1.2s
      setTimeout(() => {
        expertDialogueData.push({
          sender: 'expert',
          name: 'Coach Alex',
          text: "Got it! I've noted that for tomorrow's follow-up strategy.",
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        renderExpertChat();
      }, 1200);
    }

    function renderAubreyChat() {
      const feed = document.getElementById('chatFeed');
      if (!feed) return;

      feed.innerHTML = aubreyChatData.map(item => {
        if (item.type === 'banner') {
          return `
            <div class="priority-banner-card">
              <div class="priority-heart-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#ffffff" stroke="none">

                </svg>
              </div>
              <button class="priority-banner-close" aria-label="Close" onclick="this.parentElement.remove()">✕</button>
              <div class="priority-banner-title">${item.title}</div>
            </div>
          `;
        } else if (item.type === 'liked_photo') {
          return `
            <div class="liked-photo-container">
              <img src="${item.image}" alt="Liked Photo" class="liked-photo-img">
              <div class="liked-photo-pill">You liked Aubrey's photo.</div>
            </div>
          `;
        } else if (item.type === 'timestamp') {
          return `<div class="chat-timestamp">${item.text}</div>`;
        } else if (item.type === 'sent') {
          let html = `
            <div class="chat-message-row sent">
              <div class="bubble sent-bubble">${item.text}</div>
            </div>
          `;
          if (item.status) {
            html += `<div class="read-status">${item.status}</div>`;
          }
          return html;
        } else if (item.type === 'received') {
          return `
            <div class="chat-message-row received">
              ${item.showAvatar ? `<img src="assets/aubrey.jpg" alt="Aubrey" class="msg-avatar">` : `<div class="avatar-placeholder"></div>`}
              <div class="bubble received-bubble">${item.text}</div>
            </div>
          `;
        }
        return '';
      }).join('');
    }

    const container = document.getElementById('matchesList');

    container.innerHTML = matchesData.map((item) => `
    <div class="match-row" data-name="${item.name}">
      <img class="avatar" src="${item.image}" alt="${item.name}">
      <div class="match-info">
        <div class="name-row">
          <span class="name">${item.name}</span>
        </div>
        <div class="preview-text ${item.isMatchedNotice ? 'matched' : ''}">${item.preview}</div>
      </div>
    </div>
    <div class="divider-line"></div>
  `).join('');

    const chatOverlay = document.getElementById('chatOverlay');
    const chatBackBtn = document.getElementById('chatBackBtn');
    const chatBody = document.getElementById('chatBody');
    const expertHeader = document.getElementById('expertSheetHeader');
    const expertSendBtn = document.getElementById('expertSendBtn');
    const expertInput = document.getElementById('expertInput');

    document.querySelectorAll('.match-row').forEach(row => {
      row.addEventListener('click', () => {
        const name = row.getAttribute('data-name');
        if (name === 'Aubrey') {
          renderAubreyChat();
          renderExpertChat();
          chatOverlay.classList.add('active');
          document.body.style.overflow = 'hidden';
          if (chatBody) chatBody.scrollTop = 0;
        }
      });
    });

    chatBackBtn.addEventListener('click', () => {
      chatOverlay.classList.remove('active');
      chatOverlay.style.paddingBottom = '0px';
      document.body.style.overflow = '';
      // Reset sheet state
      sheetState = 'collapsed';
      const sheet = document.getElementById('expertBottomSheet');
      if (sheet) sheet.className = 'expert-sheet collapsed';
    });

    if (expertHeader) {
      expertHeader.addEventListener('click', toggleExpertSheet);
    }

    if (expertSendBtn) {
      expertSendBtn.addEventListener('click', sendExpertMessage);
    }

    // Mobile 60fps Synchronous Visual Viewport API Input Accessory Transformer
    let vpScheduled = false;

    function syncVisualViewport() {
      vpScheduled = false;
      if (!window.visualViewport) return;
      const chatOverlay = document.getElementById('chatOverlay');
      if (!chatOverlay || !chatOverlay.classList.contains('active')) return;

      const vpHeight = window.visualViewport.height;
      const vpOffsetTop = window.visualViewport.offsetTop || 0;
      const winHeight = window.innerHeight;
      const keyboardHeight = Math.max(0, winHeight - vpHeight - vpOffsetTop);

      if (keyboardHeight > 100 || document.activeElement === expertInput) {
        const offset = Math.max(keyboardHeight, winHeight - vpHeight);
        chatOverlay.style.paddingBottom = `${offset}px`;
        chatOverlay.classList.add('keyboard-active');
      } else {
        chatOverlay.style.paddingBottom = '0px';
        chatOverlay.classList.remove('keyboard-active');
      }

      const chatBody = document.getElementById('chatBody');
      const expertSheetBody = document.getElementById('expertSheetBody');
      if (chatBody) chatBody.scrollTop = chatBody.scrollHeight;
      if (expertSheetBody) expertSheetBody.scrollTop = expertSheetBody.scrollHeight;
    }

    function updateVisualViewport() {
      if (!vpScheduled) {
        vpScheduled = true;
        requestAnimationFrame(syncVisualViewport);
      }
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateVisualViewport, { passive: true });
      window.visualViewport.addEventListener('scroll', updateVisualViewport, { passive: true });
    }

    if (expertInput) {
      const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

      expertInput.addEventListener('focus', () => {
        document.body.style.position = 'fixed';
        document.body.style.width = '100%';
        updateVisualViewport();
        setTimeout(updateVisualViewport, 50);
        setTimeout(updateVisualViewport, 150);
        setTimeout(updateVisualViewport, 300);
      });

      expertInput.addEventListener('blur', () => {
        document.body.style.position = '';
        document.body.style.width = '';
        setTimeout(() => {
          const chatOverlay = document.getElementById('chatOverlay');
          if (chatOverlay && document.activeElement !== expertInput) {
            chatOverlay.style.paddingBottom = '0px';
            chatOverlay.classList.remove('keyboard-active');
          }
        }, 150);
      });

      const autoResize = () => {
        expertInput.style.height = 'auto';
        const newHeight = Math.min(expertInput.scrollHeight, 100);
        expertInput.style.height = Math.max(newHeight, 38) + 'px';
      };

      expertInput.addEventListener('input', autoResize);

      expertInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          if (isTouchDevice) {
            // Mobile: Enter key on virtual keyboard inserts a newline naturally
          } else if (e.shiftKey) {
            // Desktop: Shift+Enter inserts a newline naturally
          } else {
            // Desktop: Enter sends the message
            e.preventDefault();
            sendExpertMessage();
          }
        }
      });
    }
