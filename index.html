<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Matches</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      color: #000000;
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 74px;
      position: relative;
    }

    /* Header */
    .sticky-header-wrapper {
      position: sticky;
      top: 0;
      background: #ffffff;
      z-index: 99;
      width: 100%;
    }

    .header {
      text-align: center;
      padding: 15px 0 13px;
      background: #ffffff;
    }

    .header-title {
      font-size: 21.5px;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #000000;
    }

    .divider-line {
      height: 1px;
      background-color: #f0f0f0;
      width: 100%;
    }

    /* Matches List */
    .matches-list {
      display: flex;
      flex-direction: column;
    }

    .match-row {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      cursor: pointer;
      background: #ffffff;
      height: 91px;
    }

    .match-row:active {
      background: #fafafa;
    }

    .avatar {
      width: 63px;
      height: 63px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      margin-right: 16px;
      background: #f0f0f0;
    }

    .match-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 3px;
    }

    .name {
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #000000;
      line-height: 1.2;
    }



    .preview-text {
      font-size: 16px;
      color: #8e8e93;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      line-height: 1.25;
      font-weight: 400;
    }

    .preview-text.matched {
      color: #000000;
      font-weight: 600;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 390px;
      background: #111111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 28px 24px;
      z-index: 100;
      height: 74px;
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      cursor: pointer;
    }

    .nav-badge {
      position: absolute;
      top: -4px;
      right: -6px;
      background: #6A1B9A;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #111111;
    }

    .nav-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Chat Overlay View */
    .chat-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 390px;
      height: 100vh;
      background: #ffffff;
      z-index: 200;
      flex-direction: column;
    }

    .chat-overlay.active {
      display: flex;
    }

    .chat-header {
      position: sticky;
      top: 0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      z-index: 210;
      height: 54px;
      flex-shrink: 0;
    }

    .chat-back-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #000000;
    }

    .chat-header-spacer {
      width: 32px;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 84px;
      display: flex;
      flex-direction: column;
      -webkit-overflow-scrolling: touch;
    }

    /* Priority Like Banner Card */
    .priority-banner-card {
      position: relative;
      background: #ffffff;
      border: 1.5px solid #ededed;
      border-radius: 16px;
      padding: 34px 20px 22px;
      margin: 18px 4px 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .priority-heart-icon {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 40px;
      background: #111111;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .priority-banner-close {
      position: absolute;
      top: 12px;
      right: 14px;
      background: none;
      border: none;
      font-size: 18px;
      color: #000000;
      cursor: pointer;
      font-weight: 400;
      line-height: 1;
    }

    .priority-banner-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      font-weight: 600;
      color: #111111;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    /* Liked Photo Card */
    .liked-photo-container {
      position: relative;
      max-width: 78%;
      margin: 8px 4px 22px auto;
      border-radius: 16px;
      overflow: visible;
    }

    .liked-photo-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
    }

    .liked-photo-pill {
      position: absolute;
      bottom: 0px;
      right: -6px;
      background: #f7ebe6;
      color: #111111;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 14px;
      padding: 12px 24px;
      min-width: 228px;
      text-align: center;
      border-radius: 22px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
      line-height: 1.2;
      white-space: nowrap;
      z-index: 5;
    }

    /* Feed & Message Items */
    .chat-timestamp {
      font-size: 12.5px;
      color: #8e8e93;
      text-align: center;
      margin: 18px 0 12px;
      font-weight: 500;
    }

    .chat-message-row {
      display: flex;
      align-items: flex-end;
      margin-bottom: 6px;
      width: 100%;
    }

    .chat-message-row.sent {
      justify-content: flex-end;
    }

    .chat-message-row.received {
      justify-content: flex-start;
    }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 8px;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .avatar-placeholder {
      width: 28px;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .bubble {
      padding: 11px 15px;
      font-size: 15px;
      line-height: 1.35;
      max-width: 80%;
      letter-spacing: -0.01em;
      word-break: break-word;
    }

    .bubble.sent-bubble {
      background: #701A51;
      color: #ffffff;
      border-radius: 18px;
      font-weight: 400;
    }

    .bubble.received-bubble {
      background: #EFEFEF;
      color: #000000;
      border-radius: 18px;
      font-weight: 400;
    }

    .read-status {
      font-size: 12px;
      color: #8e8e93;
      text-align: right;
      margin-top: 2px;
      margin-bottom: 8px;
      font-weight: 400;
    }

    /* Fixed Bottom Input Bar */
    .chat-input-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 390px;
      height: 66px;
      background: #ffffff;
      border-top: 1px solid #f0f0f0;
      padding: 10px 16px 14px;
      display: flex;
      align-items: center;
      z-index: 220;
    }

    .chat-input-pill {
      flex: 1;
      height: 42px;
      border: 1.5px solid #e0e0e0;
      border-radius: 21px;
      padding: 0 14px 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
    }

    .chat-input-placeholder {
      color: #8e8e93;
      font-size: 15px;
      font-weight: 400;
    }

    .audio-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="sticky-header-wrapper">
    <header class="header">
      <h1 class="header-title">Matches</h1>
    </header>
    <div class="divider-line"></div>
  </div>

  <main class="matches-list" id="matchesList"></main>

  <!-- Fullscreen Chat Overlay -->
  <div id="chatOverlay" class="chat-overlay">
    <div class="chat-header">
      <button id="chatBackBtn" class="chat-back-btn" aria-label="Back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <span class="chat-title">Aubrey</span>
      <div class="chat-header-spacer"></div>
    </div>

    <div id="chatBody" class="chat-body">
      <!-- Dynamic Message Feed -->
      <div id="chatFeed"></div>
    </div>

    <!-- Fixed Bottom Input Footer -->
    <div class="chat-input-bar">
      <div class="chat-input-pill">
        <span class="chat-input-placeholder">Send a message</span>
        <div class="audio-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#000000">
            <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3" />
          </svg>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <!-- Hinge 'H' Icon -->
    <div class="nav-item">
      <svg width="100" height="100" viewBox="0 0 100 100" fill="#888888">
        <!-- Left Pillar -->
        <rect x="22" y="20" width="13" height="60" />

        <!-- Right Pillar -->
        <rect x="56" y="20" width="13" height="60" />

        <!-- Taller horizontal crossbar + matching curved flick -->
        <path d="
          M 35, 48.5
          C 38, 44  40.5, 44  43.5, 44
          L 69, 44
          C 74, 44  78.5, 40  83.5, 34
          L 91, 39.5
          C 84.5, 48.5  77.5, 57  69, 57
          L 43.5, 57
          C 38, 57  35, 63  35, 71
          Z
        " />
      </svg>
    </div>

    <!-- Star Icon -->
    <div class="nav-item">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <polygon
          points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
        </polygon>
      </svg>
    </div>

    <!-- Heart Icon with Badge -->
    <div class="nav-item">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <path
          d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
        </path>
      </svg>
      <span class="nav-badge">9</span>
    </div>

    <!-- Active Chat Speech Bubble Icon -->
    <div class="nav-item">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="#FFFFFF">
        <path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8l-4 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" />
      </svg>
    </div>

    <!-- Profile Icon -->
    <div class="nav-item">
      <img src="assets/nav_profile.png" alt="Profile" class="nav-avatar">
    </div>
  </nav>

  <script>
    const matchesData = [
      {
        name: "Divya",
        preview: "You matched with Divya",
        isMatchedNotice: true,
        image: "assets/divya.jpg"
      },
      {
        name: "Aubrey",
        preview: "ummmmmmm how's those eyes are gor",
        isMatchedNotice: false,
        image: "assets/aubrey.jpg"
      },
      {
        name: "Sydney",
        preview: "someone seems chill af",
        isMatchedNotice: false,
        image: "assets/sydney.jpg"
      },
      {
        name: "Isadora",
        preview: "You matched with Isadora",
        isMatchedNotice: true,
        image: "assets/isadora.jpg"
      },
      {
        name: "Apshara",
        preview: "if we lockin rn, we can be arguing at the",
        isMatchedNotice: false,
        image: "assets/apshara.jpg"
      },
      {
        name: "Brianna",
        preview: "who gave you such good taste ??",
        isMatchedNotice: false,
        image: "assets/brianna.jpg"
      },
      {
        name: "Mital",
        preview: "ahh good, i'm gonna be trouble. you still",
        isMatchedNotice: false,
        image: "assets/mital.jpg"
      }
    ];

    const aubreyChatData = [
      {
        type: "banner",
        title: "Your Priority Like<br>helped you stand out"
      },
      {
        type: "timestamp",
        text: "Sat, Aug 8 3:23 PM"
      },
      {
        type: "liked_photo",
        image: "assets/aubrey_liked_photo.png"
      },
      {
        type: "timestamp",
        text: "Mon, Aug 10 10:58 AM"
      },
      {
        type: "received",
        text: "Start the chat with Aubrey",
        showAvatar: false
      },
      {
        type: "timestamp",
        text: "Mon, Aug 10 11:38 AM"
      },
      {
        type: "sent",
        text: "according to YouTube you gotta message me first"
      },
      {
        type: "received",
        text: "Hahahahaha is that the protocol?! I'm new here",
        showAvatar: true
      },
      {
        type: "sent",
        text: "yep and i'm new here too :)"
      },
      {
        type: "sent",
        text: "step 2 incoming when i get off later"
      },
      {
        type: "received",
        text: "Omg what's step 2 I'm on the edge of my seat!!",
        showAvatar: true
      },
      {
        type: "sent",
        text: "someone's eager"
      },
      {
        type: "received",
        text: "Eager is my middle name",
        showAvatar: true
      },
      {
        type: "timestamp",
        text: "Tue, Aug 11 12:02 AM"
      },
      {
        type: "sent",
        text: "I like what I'm hearing"
      },
      {
        type: "sent",
        text: "step 2 is somethin a lil flirty but real"
      },
      {
        type: "sent",
        text: "ummmmmmm how's those eyes are gonna get you in trouble. text me, i'm taking you out 240 688 9865",
        status: "Sent"
      }
    ];

    function renderAubreyChat() {
      const feed = document.getElementById('chatFeed');
      if (!feed) return;

      feed.innerHTML = aubreyChatData.map(item => {
        if (item.type === 'banner') {
          return `
            <div class="priority-banner-card">
              <div class="priority-heart-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#ffffff" stroke="none">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
              </div>
              <button class="priority-banner-close" aria-label="Close" onclick="this.parentElement.remove()">✕</button>
              <div class="priority-banner-title">${item.title}</div>
            </div>
          `;
        } else if (item.type === 'liked_photo') {
          return `
            <div class="liked-photo-container">
              <img src="${item.image}" alt="Liked Photo" class="liked-photo-img">
              <div class="liked-photo-pill">You liked Aubrey's photo.</div>
            </div>
          `;
        } else if (item.type === 'timestamp') {
          return `<div class="chat-timestamp">${item.text}</div>`;
        } else if (item.type === 'sent') {
          let html = `
            <div class="chat-message-row sent">
              <div class="bubble sent-bubble">${item.text}</div>
            </div>
          `;
          if (item.status) {
            html += `<div class="read-status">${item.status}</div>`;
          }
          return html;
        } else if (item.type === 'received') {
          return `
            <div class="chat-message-row received">
              ${item.showAvatar ? `<img src="assets/aubrey.jpg" alt="Aubrey" class="msg-avatar">` : `<div class="avatar-placeholder"></div>`}
              <div class="bubble received-bubble">${item.text}</div>
            </div>
          `;
        }
        return '';
      }).join('');
    }

    const container = document.getElementById('matchesList');

    container.innerHTML = matchesData.map((item) => `
    <div class="match-row" data-name="${item.name}">
      <img class="avatar" src="${item.image}" alt="${item.name}">
      <div class="match-info">
        <div class="name-row">
          <span class="name">${item.name}</span>
        </div>
        <div class="preview-text ${item.isMatchedNotice ? 'matched' : ''}">${item.preview}</div>
      </div>
    </div>
    <div class="divider-line"></div>
  `).join('');

    const chatOverlay = document.getElementById('chatOverlay');
    const chatBackBtn = document.getElementById('chatBackBtn');
    const chatBody = document.getElementById('chatBody');

    document.querySelectorAll('.match-row').forEach(row => {
      row.addEventListener('click', () => {
        const name = row.getAttribute('data-name');
        if (name === 'Aubrey') {
          renderAubreyChat();
          chatOverlay.classList.add('active');
          if (chatBody) chatBody.scrollTop = 0;
        }
      });
    });

    chatBackBtn.addEventListener('click', () => {
      chatOverlay.classList.remove('active');
    });
  </script>

</body>

</html>
